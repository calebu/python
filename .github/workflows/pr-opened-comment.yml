name: PR merged workflow

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  on-merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Post merged PR notification
        uses: actions/github-script@v7
        with:
          script: |
            const template = `## ✅ Pull request merged

- PR: #${context.payload.pull_request.number}
- Title: ${context.payload.pull_request.title}
- Merged by: ${context.payload.pull_request.merged_by?.login || 'unknown'}
- Base branch: ${context.payload.pull_request.base.ref}

This pull request was merged successfully.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: template
            });
